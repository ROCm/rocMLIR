# .pre-commit-config.yaml
# Run on all python files except those under external/

default_stages: [commit]

exclude: '^external/llvm-project/.*'

repos:
  - repo: local
    hooks:
      - id: yapf
        name: yapf (format and restage)
        language: system
        entry: bash scripts/precommit_yapf_restage.sh
        pass_filenames: false
        stages: [commit]
