#
# PR security gate: fast, PR-side security scanners that run on every pull
# request. This complements the premerge checks in `ci.yml`. The set of
# scanners lives in `security-baseline.yml`, so scanners coming online are
# picked up here without touching this file.
#
# `report_formats: human` applies to Bandit, Gitleaks, Trivy, and Zizmor:
# their findings are uploaded as build artifacts and printed to job summaries.
# GitHub permits code-scanning uploads triggered by `pull_request` even without
# `security-events: write`, so CodeQL uploads its results independently. See
# weekly-security-scan.yml for non-PR SARIF uploads and explicit permission.

name: Security scan (PR)

on:
  pull_request:
    # Spelled out the default to avoid confusion.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@62c2c4f3effcd47711da28276815c90cb4aa6444 # v1.0.2
    with:
      report_formats: human
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
