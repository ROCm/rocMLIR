name: Claude Auto Review (coding-standards sync)

# Hard gate on the byte-for-byte sync between docs/CODING_STANDARDS.md and
# the inlined copy in claude_auto_review.yml's prompt heredoc. The auto-
# review job reads both copies (the file via the trusted overlay, the
# inlined block via the prompt) -- a silent drift would feed the
# reviewer stale standards with nothing failing CI, so this workflow
# converts the manual §15 ritual into an enforced contract.
#
# The check is the same Python one-liner documented in
# CLAUDE_AUTO_REVIEW.md §15, just promoted into a job step.
#
# pull_request (not pull_request_target): runs only `python3` against
# the checked-out tree, references no secrets, and has contents:read
# only -- so it's safe on fork PRs (worst case: this single check
# passes or fails). Mirrors the pattern of
# claude_auto_review_sanitizer_tests.yml.

on:
  pull_request:
    paths:
      - 'docs/CODING_STANDARDS.md'
      - '.github/workflows/claude_auto_review.yml'
      - '.github/workflows/claude_auto_review_coding_standards_sync.yml'

# Minimum scope: contents:read (what checkout needs); every other scope
# stays denied so a subverted check can't mutate the repo.
permissions:
  contents: read

# Cancel stale runs on a new push to the same PR head.
concurrency:
  group: claude-coding-standards-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coding-standards-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # sparse-checkout implicitly enables partial clone (--filter=blob:none),
      # so blobs outside the listed paths are never fetched.
      - name: Checkout PR
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # merge_commit_sha is the tree the maintainer will merge -- the
          # right thing to test. It can be null while GitHub is still
          # computing mergeability or when the PR is in conflict; in
          # either case we don't want actions/checkout's default ref
          # (refs/pull/<n>/merge, a moving ref that races a force-push)
          # silently picking a tree we didn't reason about. Fall back to
          # the event-fixed head.sha so the run is deterministic and
          # still tests this PR's contents. Same fallback pattern as
          # claude_auto_review.yml's own checkout.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            docs/CODING_STANDARDS.md
            .github/workflows/claude_auto_review.yml

      # python3 + PyYAML are preinstalled on github-hosted ubuntu images.
      - name: Verify docs/CODING_STANDARDS.md matches the inlined prompt block
        run: |
          python3 - <<'PY'
          import re
          import sys
          import yaml

          wf = yaml.safe_load(open('.github/workflows/claude_auto_review.yml'))
          steps = wf['jobs']['review']['steps']
          claude_step = next(
              s for s in steps
              if s.get('uses', '').startswith('anthropics/claude-code-action')
          )
          prompt = claude_step['with']['prompt']

          marker_re = (
              r'<BEGIN docs/CODING_STANDARDS\.md>\n'
              r'(.*?)'
              r'\n\s*<END docs/CODING_STANDARDS\.md>'
          )
          m = re.search(marker_re, prompt, re.S)
          if not m:
              print(
                  '::error file=.github/workflows/claude_auto_review.yml::'
                  '<BEGIN docs/CODING_STANDARDS.md> / '
                  '<END docs/CODING_STANDARDS.md> markers not found in the '
                  "review job's prompt heredoc."
              )
              sys.exit(1)

          inlined = m.group(1).strip()
          # The inlined block omits the H1 title of the file (first two
          # lines: "# rocMLIR Coding Standards" + blank). Same
          # slicing as the §15 verification one-liner.
          file_body = '\n'.join(
              open('docs/CODING_STANDARDS.md').read().splitlines()[2:]
          ).strip()

          if inlined != file_body:
              import difflib
              diff = '\n'.join(
                  difflib.unified_diff(
                      file_body.splitlines(),
                      inlined.splitlines(),
                      fromfile='docs/CODING_STANDARDS.md (minus H1)',
                      tofile='inlined block in claude_auto_review.yml',
                      lineterm='',
                  )
              )
              print(
                  '::error file=docs/CODING_STANDARDS.md::'
                  'docs/CODING_STANDARDS.md and the inlined block in '
                  '.github/workflows/claude_auto_review.yml have drifted. '
                  'The auto-review job reads both copies; they MUST match '
                  'byte-for-byte. See CLAUDE_AUTO_REVIEW.md §15 for the '
                  'sync contract. Diff:'
              )
              print(diff)
              sys.exit(1)

          print('in-sync')
          PY
