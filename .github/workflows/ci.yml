name: Python Lint and Format Check

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
    paths:
      - "mlir/**"
      - "external/**"
      - "!external/llvm-project/**"
  push:
    branches:
      - develop
      - 'release/**'
    paths:
      - "mlir/**"
      - "external/**"
      - "!external/llvm-project/**"
jobs:
  py-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 yapf pep8-naming
          pip3 install -r pip_requirements.txt
          pip3 install --index-url https://test.pypi.org/simple/ hip-python

      - name: Get changed Python files under mlir/
        id: changes
        shell: bash
        run: |
          echo "Determining merge base..."

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="origin/${{ github.ref_name }}"
          fi

          echo "BASE_REF=$BASE_REF"
          git fetch origin ${BASE_REF#origin/} --depth=1 || true

          # Verify that BASE_REF exists locally
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            echo "Error: Base ref '$BASE_REF' does not exist locally. Fetch may have failed." >&2
            exit 1
          fi
          BASE_SHA=$(git merge-base HEAD "$BASE_REF")
          echo "BASE_SHA=$BASE_SHA"

          # Get added/modified Python files under mlir/
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD \
                    | grep -E '^mlir/.*\.py$' || true)

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Changed Python files:"
          echo "$files"

      - name: Run flake8
        if: steps.changes.outputs.files != ''
        run: |
          flake8 --ignore=E501,E251,E124,W605,W504,E131,E126,W503 \
            ${{ steps.changes.outputs.files }}

      - name: Run YAPF check
        if: steps.changes.outputs.files != ''
        run: |
          yapf --diff ${{ steps.changes.outputs.files }} \
            || (echo "Format issues found. Fix locally with: yapf -i <files>"; exit 1)

      - name: No Python changes in mlir/
        if: steps.changes.outputs.files == ''
        run: echo "No changed *.py files under mlir/ – skipping."
