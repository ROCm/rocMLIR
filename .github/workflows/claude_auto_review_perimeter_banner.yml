name: Claude Auto Review (perimeter-banner)

# Companion to claude_auto_review.yml.
#
# Fires on every PR open / synchronize / reopen, including PRs from forks.
# If the PR's diff against base touches the security-critical paths whose
# contents control whether secrets are protected at runtime by the main
# claude_auto_review.yml workflow (.github/workflows/, .github/scripts/,
# .claude/), this workflow:
#   1. Ensures the `modifies-ci-paths` repository label exists.
#   2. Applies the `modifies-ci-paths` label to the PR (idempotent).
#   3. Posts a one-time banner comment warning maintainers that applying
#      `claude-review` on this PR is unsafe without manual diff audit;
#      "one-time" via a hidden HTML marker that subsequent runs detect.
#
# If a subsequent push removes the perimeter modifications, this workflow
# removes the `modifies-ci-paths` label so the PR's labelset is accurate.
# The historical banner comment is left in place as a record for reviewers.
#
# This workflow is part of "Layer 2" of the SECURITY MODEL described in
# the header of claude_auto_review.yml: it makes the maintainer-procedure
# layer (audit perimeter modifications before applying claude-review) more
# robust by surfacing perimeter modifications visually in the PR's
# label set and as a top-level comment, instead of relying on the
# maintainer to spot them in the file diff.
#
# WHY pull_request_target IS SAFE IN THIS FILE SPECIFICALLY
# =========================================================
# Same pattern as claude_auto_review_fork_notify.yml. The dangerous
# pull_request_target preconditions (checkout PR HEAD + execute
# user-controlled code with secrets in env) do NOT hold here:
#
#   - There is NO actions/checkout step. The PR's code never touches the
#     runner. We compute the file list via the GitHub API, not via git.
#   - The only commands run are read-only API queries (`gh api ... files`,
#     `gh api ... comments`), label management on a hardcoded label name
#     (`gh pr edit --add-label`, `gh label create --force`, `gh pr edit
#     --remove-label`), and `gh pr comment` with a body containing only
#     hardcoded text plus the perimeter-changed file names.
#   - PR-author-controlled strings never reach the shell as commands. The
#     changed-file list is captured into a shell variable via $(...) and
#     interpolated into the comment body via heredoc text substitution
#     (the substitution result is treated as a string, not re-evaluated).
#   - permissions: pull-requests: write + issues: write only.
#
# Same canonical "safe pull_request_target" pattern as the fork-notify
# workflow: read PR metadata, manage labels, post a fixed-template comment.
# Never check out, never execute PR code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Default-deny at workflow level. The job below opts back in to only
# what it actually needs.
permissions: {}

# Cancel an in-flight run if a new push lands on the same PR. We only
# care about the LATEST head's perimeter status, and posting/labeling
# from a stale run could race with the new run.
concurrency:
  group: claude-perimeter-banner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `pull-requests: write` for `gh pr comment` and `gh pr edit`.
    # `issues: write` for the labels API endpoint (PRs are issues in
    # GitHub's data model; label operations live on /issues/.../labels
    # and require issues:write, not pull-requests:write).
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Detect perimeter modifications, label, banner-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Hidden marker used to detect whether THIS workflow has
          # already posted a banner on this PR. Bumping the version
          # suffix forces a re-post on the next event (useful if the
          # banner text needs to change for an existing perimeter PR).
          BANNER_MARKER: '<!-- claude-perimeter-banner:v1 -->'
          # IMPORTANT: this regex must stay in sync with the Layer-3
          # perimeter-block step in claude_auto_review.yml (search for
          # "Block if PR modifies CI security perimeter"). Both encode
          # the same security-perimeter definition.
          PERIMETER_REGEX: '^(\.github/workflows/|\.github/scripts/|\.claude/)'
          # The default branch is what `workflow_dispatch` runs from
          # (and therefore what the comment instructs the maintainer
          # to use as the trusted source for re-running). Fall back to
          # 'develop' on the off-chance the event payload is malformed.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The bot identity behind secrets.GITHUB_TOKEN. Used to
          # filter the duplicate-banner check so a regular PR comment
          # containing the marker text cannot suppress the banner --
          # without this filter, a malicious PR author could post a
          # comment containing `<!-- claude-perimeter-banner:v1 -->`
          # and the workflow would silently skip the real warning on
          # the next perimeter-touching push.
          # If/when this workflow migrates to a GitHub App token,
          # update this to the App's bot login (e.g. `my-app[bot]`).
          EXPECTED_AUTHOR: 'github-actions[bot]'
        run: |
          set -euo pipefail

          # ---- 1. Get the changed-file list from the API ------------
          # No git operations -- the workspace is empty (no checkout).
          changed=$(gh api --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')

          perimeter=$(printf '%s\n' "$changed" \
            | grep -E "$PERIMETER_REGEX" \
            || true)

          # ---- 2. Branch on perimeter touched / not touched ---------
          if [ -z "$perimeter" ]; then
            # PR no longer touches perimeter. Remove stale label if it's
            # there. We OWN the modifies-ci-paths label name -- a
            # maintainer who wants a personal marker should use a
            # different name, so silently removing here is safe.
            if gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
                --remove-label modifies-ci-paths >/dev/null 2>&1; then
              echo "Removed stale modifies-ci-paths label from PR #${PR_NUMBER}."
            else
              echo "PR #${PR_NUMBER} does not touch the CI security perimeter; nothing to do."
            fi
            exit 0
          fi

          # ---- 3. Perimeter touched: ensure label exists ------------
          # `gh label create --force` is upsert-style: creates if absent,
          # updates color/description if present. Safe to call on every
          # run; the only effect on existing repos is keeping the
          # label's color/description in sync with what's defined here.
          gh label create modifies-ci-paths --repo "${REPO}" \
            --color D93F0B \
            --description "PR modifies the Claude review CI security perimeter; audit before applying claude-review" \
            --force >/dev/null 2>&1 || true

          # ---- 4. Apply the label to the PR (idempotent) ------------
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
            --add-label modifies-ci-paths >/dev/null
          echo "Applied modifies-ci-paths label to PR #${PR_NUMBER}."

          # ---- 5. Check if banner comment already exists ------------
          # Filter on BOTH (author == github-actions[bot]) AND (body
          # contains the marker). The author filter is critical for
          # security: without it, any PR commenter could include the
          # public marker text in a regular comment to silently
          # suppress the warning banner on subsequent perimeter-
          # touching pushes. user.login is server-determined from the
          # auth token used for the comment, so a PR author commenting
          # under their own account cannot impersonate the bot.
          # Use jq's env.* binding so we don't have to shell-escape
          # the marker (it contains < > ! which would be brittle to
          # inline-quote into a jq filter). Per_page=100 avoids paging;
          # PRs with >100 comments where our marker is past page 1
          # would re-post on a follow-up event, which is an acceptable
          # degenerate case.
          existing=$(MARKER="${BANNER_MARKER}" \
            AUTHOR="${EXPECTED_AUTHOR}" \
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[]
                    | select(.user.login == env.AUTHOR
                             and (.body | contains(env.MARKER)))
                    | .id' \
            | head -n1)

          if [ -n "$existing" ]; then
            echo "Banner already posted on PR #${PR_NUMBER} (comment id=${existing}); skipping."
            exit 0
          fi

          # ---- 6. Post the banner comment ---------------------------
          # The perimeter-changed file paths are PR-controlled. We
          # interpolate them into the heredoc as TEXT (the substitution
          # result is treated as a string by bash, never re-evaluated
          # as shell), so a path containing $(rm -rf /) would land in
          # the comment body as the literal characters "$(rm -rf /)"
          # rather than running anything. But a path containing a
          # backtick or triple-backtick would still break out of the
          # surrounding markdown fence and let an attacker inject
          # arbitrary markdown into a comment posted by the bot.
          # Defense:
          #   - Render the file list as a markdown bullet list with
          #     each filename in inline-code (single backticks) instead
          #     of inside a fenced code block.
          #   - Strip backticks from filenames before wrapping them in
          #     inline-code (which would otherwise break the inline
          #     code-span). The perimeter regex limits us to paths
          #     under .github/workflows/, .github/scripts/, .claude/
          #     where backticks are not realistic, so this is a
          #     defensive transform with no practical loss of detail.
          #   - Cap the displayed list at 50 entries with an overflow
          #     indicator, so a pathological PR (or a brute-force
          #     attempt to bury the comment) can't produce an
          #     unboundedly large bot comment.
          perimeter_total=$(printf '%s\n' "$perimeter" | grep -c .)
          perimeter_md=$(printf '%s\n' "$perimeter" \
            | head -n 50 \
            | sed -e 's/`//g' -e 's/^/- `/' -e 's/$/`/')
          perimeter_overflow=""
          if [ "$perimeter_total" -gt 50 ]; then
            perimeter_overflow=$'\n\n_...and '"$((perimeter_total - 50))"' more perimeter file(s) not shown._'
          fi
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "$(cat <<EOF
          ${BANNER_MARKER}
          ### :warning: This PR modifies the Claude-review CI security perimeter

          The following files in this PR control whether and how the
          \`claude-review\` workflow protects its LLM Gateway secrets at
          runtime (see the SECURITY MODEL section in
          \`.github/workflows/claude_auto_review.yml\`):

          $perimeter_md$perimeter_overflow

          **Before applying the \`claude-review\` label on this PR**, please:

          1. Audit the diff in these paths line-by-line. A malicious or
             accidental change could disable the \`--allowedTools\`
             restriction, the overlay step, the sanitizer, or the
             review/post job split -- any of which would expose the
             secrets in env to the PR-modified workflow.
          2. If the changes are legitimate and you want a Claude review,
             do NOT apply the \`claude-review\` label. Instead, run via
             **Actions → Claude Auto Review → Run workflow** and enter
             this PR's number. The dispatch path runs from the trusted,
             code-owner-approved version of the workflow on
             \`${DEFAULT_BRANCH:-develop}\`, so a malicious PR-side
             modification cannot affect the run.

          (This banner is automated. The \`modifies-ci-paths\` label
          will be removed automatically if a future push removes the
          perimeter modifications. The Layer-3 in-workflow guard will
          additionally fail the \`claude-review\` label-triggered run
          on this PR if the label is applied while perimeter changes
          are present.)
          EOF
          )"
          echo "Posted perimeter banner comment on PR #${PR_NUMBER}."
