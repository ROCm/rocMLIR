# Tests in this directory exercise FP4 scaled-GEMM tuning paths and only
# run on the nightly CI configuration.
if not config.enable_rock_driver_e2e_test or config.no_AMD_GPU:
    config.unsupported = True

# FP4 scaled-MFMA is currently only supported on gfx950. This mirrors the
# gating used by every other FP4 test in the repo (e.g. mlir/test/e2e/*F4.cfg,
# mlir/test/e2e/*Scaled*.cfg, mlir/test/fusion/pr-e2e/mixr-gemm-fp4/lit.local.cfg).
if not (hasattr(config, 'arch') and config.arch and "gfx950" in config.arch):
    config.unsupported = True
