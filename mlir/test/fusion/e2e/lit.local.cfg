# This'll run whenever we're not building a fat library build, and isn't
# controlled by the e2e test switches.
if not config.enable_rock_driver_any_e2e_test or config.no_AMD_GPU:
  config.unsupported = True

if not config.arch_support_mfma and not config.arch_support_wmma:
  config.excludes = ['mixr-gemm-gemm']

if not (hasattr(config, 'arch') and config.arch and "gfx950" in config.arch):
  if hasattr(config, 'excludes') and isinstance(config.excludes, list):
    config.excludes.append('mixr-gemm-fp4')
  else:
    config.excludes = ['mixr-gemm-fp4']

