directory = "PrConvElementwiseGemmF16SplitK"
prefix = "rocmlir-gen"
suffix = "--operation conv_gemm -t f16 --arch %arch -pv %constrained_range_random_data -rand_type float %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext,%linalg_test_lib_dir/libmlir_c_runner_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

[[axis]]
name = "layout"
values = ["-fil_layout=gkcyx -in_layout=ngchw", "-fil_layout=gkyxc -in_layout=nhwgc"]

[[axis]]
name = "splitKFactor"
values = ["attn:v2:64,128,32,16,32,16,4,3,1,2,1",
          "attn:v2:64,128,32,16,32,16,4,8,1,2,1",
          "attn:v2:32,128,32,32,32,16,8,4,1,2,1"]
prefix = "-perf_config="

## conv+gemm split-k variant
[[suite]]
name = "pr_conv_gemm_f16_splitk"

[[suite.test]]
config = "-groupsize=1 -batchsize=64 -in_channels=128 -out_channels=128 -in_h=28 -in_w=28 -fil_h=3 -fil_w=3 -dilation_h=1 -dilation_w=1 -conv_stride_h=2 -conv_stride_w=2 -padding_h_l=1 -padding_h_r=1 -padding_w_l=1 -padding_w_r=1 -gemmO=64"

[[suite.test]]
config = "-groupsize=1 -batchsize=64 -in_channels=128 -out_channels=128 -in_h=28 -in_w=28 -fil_h=3 -fil_w=3 -dilation_h=2 -dilation_w=2 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=1 -padding_h_r=1 -padding_w_l=1 -padding_w_r=1 -gemmO=64"
