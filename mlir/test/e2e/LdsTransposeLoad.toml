directory = "LdsTransposeLoad"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv %constrained_float_range_random_data %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "data type"
values = ["f16", "bf16"]
prefix = "-t "

# ============================================================================
# Suite 1: BOTH A and B use LDS transpose (transA=true, transB=false)
# Comprehensive coverage of kpack (1,4,8,16,32) and kpackPerBlock (2,4,8,16,32)
# ============================================================================
[[suite]]
name = "lds_transpose_both_operands"

# kpack=1 with kpackPerBlock >= 16, kpack=4 with kpackPerBlock < 16
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=true --transB=false --perf_config v3:64,64,8,32,32,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=true --transB=false --perf_config v3:128,64,16,32,32,1,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 512 -k 2048 -n 512 --transA=true --transB=false --perf_config v3:32,32,32,32,32,1,1,3,2,1,1"

# kpack=4, various kpackPerBlock
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=true --transB=false --perf_config v3:64,64,8,32,32,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 256 -n 2048 --transA=true --transB=false --perf_config v3:128,128,4,32,32,4,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 512 -k 512 -n 512 --transA=true --transB=false --perf_config v3:32,32,16,32,32,4,1,3,2,1,1"

# kpack=8, various kpackPerBlock
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 1024 --transA=true --transB=false --perf_config v3:64,64,4,32,32,8,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 1024 -n 2048 --transA=true --transB=false --perf_config v3:128,64,8,32,32,8,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 512 -k 256 -n 512 --transA=true --transB=false --perf_config v3:32,32,2,32,32,8,1,3,2,1,1"

# kpack=16, various kpackPerBlock
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=true --transB=false --perf_config v3:64,64,4,32,32,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=true --transB=false --perf_config v3:128,128,2,32,32,16,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 512 -k 2048 -n 512 --transA=true --transB=false --perf_config v3:32,32,8,16,16,16,1,3,2,1,1"

# kpack=32, various kpackPerBlock
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=true --transB=false --perf_config v3:64,64,2,32,32,32,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 2048 -n 2048 --transA=true --transB=false --perf_config v3:128,64,4,32,32,32,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 512 -k 512 -n 512 --transA=true --transB=false --perf_config v3:32,32,4,16,16,32,1,3,2,1,1"

# Grouped GEMM
[[suite.test]]
config = "-g 64 -m 1024 -k 256 -n 1024 --transA=true --transB=false --perf_config v3:64,64,8,32,32,4,1,3,2,1,1"

[[suite.test]]
config = "-g 128 -m 512 -k 512 -n 512 --transA=true --transB=false --perf_config v3:32,32,16,32,32,8,1,4,2,1,1"

# 8 waves configurations
[[suite.test]]
config = "-g 1 -m 1024 -k 256 -n 512 --transA=true --transB=false --perf_config v4:64,32,8,16,16,16,16,1,4,2,0,0,1,1"

[[suite.test]]
config = "-g 1 -m 256 -k 512 -n 2048 --transA=true --transB=false --perf_config v4:16,128,8,16,16,16,16,1,4,2,0,0,1,1"

# 16 waves configurations
[[suite.test]]
config = "-g 1 -m 2048 -k 256 -n 512 --transA=true --transB=false --perf_config v4:128,32,8,16,16,16,16,1,4,2,0,0,1,1"

[[suite.test]]
config = "-g 1 -m 256 -k 512 -n 4096 --transA=true --transB=false --perf_config v4:16,256,8,16,16,16,16,1,4,2,0,0,1,1"

# ============================================================================
# Suite 2: ONLY A uses LDS transpose (transA=true, transB=true)
# B uses regular load - hybrid scenario
# ============================================================================
[[suite]]
name = "lds_transpose_A_only_hybrid"

# kpack=1
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 1024 --transA=true --transB=true --perf_config v3:64,64,16,32,32,1,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 1024 -n 2048 --transA=true --transB=true --perf_config v3:128,128,8,64,32,4,1,3,2,1,1"

# kpack=4
[[suite.test]]
config = "-g 1 -m 1024 -k 256 -n 1024 --transA=true --transB=true --perf_config v3:64,64,4,32,32,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=true --transB=true --perf_config v3:128,64,8,32,16,4,1,4,2,1,1"

# kpack=8
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=true --transB=true --perf_config v3:64,64,2,32,32,8,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 256 -n 2048 --transA=true --transB=true --perf_config v3:128,128,4,64,16,8,1,4,2,1,1"

# kpack=16
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 1024 --transA=true --transB=true --perf_config v3:64,64,2,32,32,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 1024 -n 2048 --transA=true --transB=true --perf_config v3:128,64,4,32,32,16,1,4,2,1,1"

# kpack=32
[[suite.test]]
config = "-g 1 -m 1024 -k 2048 -n 1024 --transA=true --transB=true --perf_config v3:64,64,4,32,16,32,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=true --transB=true --perf_config v3:128,128,2,64,32,32,1,4,2,1,1"

# Grouped GEMM
[[suite.test]]
config = "-g 64 -m 512 -k 512 -n 512 --transA=true --transB=true --perf_config v3:32,64,8,32,32,8,1,3,2,1,1"

# ============================================================================
# Suite 3: ONLY B uses LDS transpose (transA=false, transB=false)
# A uses regular load - hybrid scenario
# ============================================================================
[[suite]]
name = "lds_transpose_B_only_hybrid"

# kpack=4 (kpackPerBlock <= 8 requires kpack >= 4)
[[suite.test]]
config = "-g 1 -m 1024 -k 256 -n 1024 --transA=false --transB=false --perf_config v3:64,64,8,32,16,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=false --transB=false --perf_config v3:128,64,4,32,32,4,1,4,2,1,1"

# kpack=4
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 1024 --transA=false --transB=false --perf_config v3:64,64,8,32,16,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 1024 -n 2048 --transA=false --transB=false --perf_config v3:128,128,4,64,32,4,1,4,2,1,1"

# kpack=8
[[suite.test]]
config = "-g 1 -m 1024 -k 256 -n 1024 --transA=false --transB=false --perf_config v3:64,64,2,32,32,8,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 512 -n 2048 --transA=false --transB=false --perf_config v3:128,64,4,32,32,8,1,4,2,1,1"

# kpack=16
[[suite.test]]
config = "-g 1 -m 1024 -k 1024 -n 1024 --transA=false --transB=false --perf_config v3:64,64,4,32,16,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 256 -n 2048 --transA=false --transB=false --perf_config v3:128,128,2,64,32,16,1,4,2,1,1"

# kpack=32
[[suite.test]]
config = "-g 1 -m 1024 -k 512 -n 1024 --transA=false --transB=false --perf_config v3:64,64,2,32,32,32,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 2048 -k 1024 -n 2048 --transA=false --transB=false --perf_config v3:128,64,2,32,32,32,1,4,2,1,1"

# Grouped GEMM
[[suite.test]]
config = "-g 64 -m 512 -k 256 -n 512 --transA=false --transB=false --perf_config v3:32,32,4,32,16,8,1,3,2,1,1"

# ============================================================================
# Suite 4: Large matrices (stress tests)
# ============================================================================
[[suite]]
name = "lds_transpose_large_matrices"

[[suite.test]]
config = "-g 1 -m 4096 -k 4096 -n 4096 --transA=true --transB=false --perf_config v3:128,128,8,64,32,8,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 8192 -k 1024 -n 8192 --transA=true --transB=false --perf_config v3:128,128,4,64,64,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 1024 -k 8192 -n 1024 --transA=true --transB=false --perf_config v3:64,64,8,32,32,32,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 3072 -k 1024 -n 3072 --transA=true --transB=false --perf_config v3:128,64,8,32,32,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 1536 -k 6144 -n 1536 --transA=true --transB=false --perf_config v3:64,64,16,32,32,8,1,4,2,1,1"

# Large with grouped
[[suite.test]]
config = "-g 32 -m 2048 -k 1024 -n 2048 --transA=true --transB=false --perf_config v3:128,128,8,64,32,8,1,3,2,1,1"

[[suite.test]]
config = "-g 16 -m 4096 -k 512 -n 4096 --transA=true --transB=false --perf_config v3:128,64,4,32,32,16,1,4,2,1,1"
