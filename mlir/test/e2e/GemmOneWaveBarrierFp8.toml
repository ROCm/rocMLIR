# One-wave GEMM barrier optimization test for fp8 (scheduleVersion=1)

directory = "GemmOneWaveBarrierFp8"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "data type"
values = ["fp8_fp8"]
prefix = "-t "

[[axis]]
name = "perf_config"
# One-wave: mPerBlock=mPerWave=32, nPerBlock=nPerWave=32, kpackPerBlock=16, scheduleVersion=1
values = ["v4:32,32,16,32,32,32,1,1,1,2,0,0,1,1"]
prefix = "-perf_config="

[[suite]]
name = "gemm_one_wave_barrier_fp8"

# gridSize = (m/32) * (n/32) = (1024/32) * (1024/32) = 32 * 32 = 1024 > 4*numCU
[[suite.test]]
config = "-g 1 -m 1024 -k 64 -n 1024"
