directory = "PrAttentionF32"
prefix = "rocmlir-gen"
suffix = "--operation attention -t f32 --arch %arch -pv %random_data %rocmlir_gen_flags -relDiff_threshold 0.00005 | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transK"
values = ["true", "false"]
prefix = "--transK="

## attention variant
[[suite]]
name = "pr_attention_f32"

[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64"

[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v2:32,32,64,32,32,32,4,1,1,2,1"

## This one test kPerBlock (16 x 4) == head_dim case
[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v2:64,64,64,16,32,32,4,1,1,2,1"

[[suite.test]]
config = "-seq_len_q 64 -seq_len_k 64 -head_dim_qk 64 -head_dim_v 64"

# check scale
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale"

# check bias
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-bias"

# check scale and bias together
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# cross attention
[[suite.test]]
config = "-seq_len_q 128 -seq_len_k 27 -head_dim_qk 64 -head_dim_v 32 --with-attn-scale --with-attn-bias"

# issue 1661
[[suite.test]]
config = "-seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# causal
[[suite.test]]
config = "-seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# GQA
[[suite.test]]
config = "-num_heads_q 4 -num_heads_kv 2 -seq_len_q 384 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + KV Cache
[[suite.test]]
config = "-rand 1 -last_valid_kv_index=17 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + KV Cache batch=3
[[suite.test]]
config = "-rand 1 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + KV Cache batch=3 + return LSE
[[suite.test]]
config = "-rand 1 -return_lse -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + KV Cache batch=3 + return LSE + split-kv
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + KV Cache batch=3 + return LSE + split-kv (padding)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + causal + KV Cache batch=3
[[suite.test]]
config = "-rand 1 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# GQA + causal + KV Cache batch=3 + return LSE
[[suite.test]]
config = "-rand 1 -return_lse -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# GQA + causal + KV Cache batch=3 + return LSE + split-kv
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# GQA + causal + KV Cache batch=3 + return LSE + split-kv (padding)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# GQA + causal + KV Cache batch=3 + return LSE + split-kv (padding) + sliding window
#[[suite.test]]
#config = "-rand 1 -return_lse -split_kv 8 -last_valid_kv_index=17,1,32 -sliding_window_look_back=64 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# Active sliding lower mask in a nonzero key-sequence block. MPerBlockG0 is 32,
# while P - L is 95, inside the [64, 96) M block.
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -last_valid_kv_index=159 -sliding_window_look_back=64 -g 1 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -perf_config attn:v2:32,32,64,32,32,32,4,1,1,2,1"

# GQA + prefix causal + KV Cache batch=3 + return LSE + split-kv (padding)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -prefix_offset=18,5,16 -last_valid_kv_index=17,1,32 -g 3 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias"

# --- split-KV without KV cache (non-causal) ---
# Exercises the non-causal branch of getMLoopInfo (ceil-div + minui clamp) and
# the host f32 split-KV combine. Previously split-KV was only covered with a KV
# cache (last_valid_kv_index) present.
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# non-causal split-KV with empty trailing splits (splitKV > populated M blocks):
# the guarded scaleFinalOutput (sum == 0) and clamped split bounds must keep the
# combined result finite instead of producing NaNs.
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 8 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# GQA + non-causal split-KV without KV cache
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 1 -seq_len_k 384 -head_dim_qk 64 -head_dim_v 64 --with-attn-scale --with-attn-bias"

# --- causal / prefix split-KV with seqLenQ > 1: per-row valid-split mask ---
# Exercises the per-(batch-head, query-row) valid-split mask in the host
# reference together with per-row causal masking in the kernel.
# f32 split-KV recombination reorders the softmax accumulation, so a few
# elements exceed the file-wide 5e-5 relDiff on some archs (e.g. gfx950) while
# RMS stays ~1e-7. -absDiff_threshold gates relDiff on absolute error
# (numpy/torch allclose style); RMS + absDiff still catch real regressions.
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -seq_len_q 16 -seq_len_k 256 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -absDiff_threshold 1e-4"

# GQA + causal split-KV with seqLenQ > 1
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -num_heads_q 4 -num_heads_kv 2 -seq_len_q 16 -seq_len_k 256 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -absDiff_threshold 1e-4"

# prefix causal + KV cache + split-KV with seqLenQ > 1 (per-row mask + prefix offset)
[[suite.test]]
config = "-rand 1 -return_lse -split_kv 4 -prefix_offset=8 -last_valid_kv_index=200 -seq_len_q 16 -seq_len_k 256 -head_dim_qk 64 -head_dim_v 64 -causal --with-attn-scale --with-attn-bias -absDiff_threshold 1e-4"
