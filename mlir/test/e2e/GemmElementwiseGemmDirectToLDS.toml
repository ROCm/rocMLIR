directory = "GemmElementwiseGemmDirectToLDS"
prefix = "rocmlir-gen"
suffix = "--operation gemm_gemm --arch %arch -pv %constrained_range_random_data -rand_type float %rocmlir_gen_flags -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15 | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "t"
values = ["f16", "bf16"]
prefix = "-t "

[[axis]]
name = "schedule_version"
values = ["3", "4"]
prefix = "--schedule_version "

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

## gemm+gemm variant
[[suite]]
name = "gemm_gemm_direct_to_lds"

[[suite.test]]
config = "-m 384 -n 384 -k 64 -gemmO 64"

[[suite.test]]
config = "-m 256 -n 256 -k 128 -gemmO 128"

[[suite.test]]
config = "-m 64 -n 64 -k 64 -gemmO 64"
