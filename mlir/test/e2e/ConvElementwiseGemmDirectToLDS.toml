directory = "ConvElementwiseGemmDirectToLDS"
prefix = "rocmlir-gen"
suffix = "--operation conv_gemm --arch %arch -pv %constrained_range_random_data -rand_type float %rocmlir_gen_flags -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15 | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext,%linalg_test_lib_dir/libmlir_c_runner_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "t"
values = ["f16", "bf16"]
prefix = "-t "

[[axis]]
name = "schedule_version"
values = ["3", "4"]
prefix = "--schedule_version "

[[axis]]
name = "layout"
values = ["-fil_layout=gkcyx -in_layout=ngchw", "-fil_layout=gkyxc -in_layout=nhwgc"]

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

## conv+gemm variant
[[suite]]
name = "conv_gemm_direct_to_lds"

[[suite.test]]
config = "-groupsize=1 -batchsize=2 -in_channels=128 -out_channels=128 -in_h=28 -in_w=28 -fil_h=3 -fil_w=3 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=0 -padding_h_r=0 -padding_w_l=0 -padding_w_r=0 -gemmO=64"

[[suite.test]]
config = "-groupsize=1 -batchsize=2 -in_channels=256 -out_channels=128 -in_h=32 -in_w=32 -fil_h=1 -fil_w=1 -dilation_h=1 -dilation_w=1 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=0 -padding_h_r=0 -padding_w_l=0 -padding_w_r=0 -gemmO=128"

[[suite.test]]
config = "-groupsize=1 -batchsize=2 -in_channels=128 -out_channels=128 -in_h=28 -in_w=28 -fil_h=3 -fil_w=3 -dilation_h=2 -dilation_w=2 -conv_stride_h=1 -conv_stride_w=1 -padding_h_l=0 -padding_h_r=0 -padding_w_l=0 -padding_w_r=0 -gemmO=64"
