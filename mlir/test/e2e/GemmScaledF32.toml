# these test need to be run with `-rand none`. It is using f32 scales. On the host side it doesn't get quantized to f8E8M0FNU but on the GPU it does get quantized. 
# therefore to avoid quantization errors, run with `-rand none`. 
directory = "GemmScaledF32"
prefix = "rocmlir-gen"
suffix = "--operation gemm -out_dtype f32 --arch %arch %pv -rand none %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true", "false"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["true", "false"]
prefix = "--transB="

[[axis]]
name = "transC"
values = ["true", "false"]
prefix = "--transC="

[[axis]]
name = "data type"
values = ["f4E2M1FN"]
prefix = "-t "

[[axis]]
name = "scaledGemm"
values = ["true"]
prefix = "--scaledGemm=" 

[[axis]]
name = "scaleA dtype"
values = ["f32"]
prefix = "-scale_a_dtype "

[[axis]]
name = "scaleB dtype"
values = ["f32"]
prefix =  "-scale_b_dtype "

[[axis]]
name = "schedule_version"
values = ["1", "2"]
prefix = "--schedule_version  "

## Gemm variants
[[suite]]
name = "gemm_scaled_f32"

[[suite.test]]
config = "-g 3 -m 1024 -k 768 -n 1024"

[[suite.test]]
config = "-g 1 -m 1 -k 32 -n 1"

[[suite.test]]
config = "-g 1 -m 512 -k 32 -n 512"
