directory = "AttentionVectorizationRegression"
prefix = "rocmlir-gen"
suffix = "--operation attention --arch %arch -pv %random_data -rand_min 0 -rand_max 1 -rand_type float %rocmlir_gen_flags -relDiff_threshold 0.3 -absDiff_threshold 0.3 -RMS_threshold 0.15 | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "t"
values = ["f16", "bf16"]
prefix = "-t "

[[axis]]
name = "transQ"
values = ["true", "false"]
prefix = "--transQ="

[[axis]]
name = "transK"
values = ["true", "false"]
prefix = "--transK="

[[axis]]
name = "transV"
values = ["true", "false"]
prefix = "--transV="

[[axis]]
name = "transO"
values = ["true", "false"]
prefix = "--transO="

[[suite]]
name = "attention_vectorization_regression"

# AIROCMLIR-811 regression: the original failing tuning candidate. Pre-fix the
# held-constant Unmerge analysis over-extended the contiguous vector length on
# GEMM1's bypass-LDS B-operand write, producing NaNs in softmax. The perf_config
# only fits MFMA LDS budgets, so this suite is mfma-gated via the sibling .cfg.
[[suite.test]]
config = "-seq_len_q 128 -seq_len_k 256 -head_dim_qk 64 -head_dim_v 128 -perf_config attn:v3:128,128,256,4,128,64,16,4,1,1,2,0,1"
