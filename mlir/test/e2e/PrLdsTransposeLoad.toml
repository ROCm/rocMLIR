directory = "PrLdsTransposeLoad"
prefix = "rocmlir-gen"
suffix = "--operation gemm --arch %arch %pv %random_data %rocmlir_gen_flags | rocmlir-driver -c | mlir-runner -O2 --shared-libs=%linalg_test_lib_dir/libmlir_rocm_runtime%shlibext,%conv_validation_wrapper_library_dir/libconv-validation-wrappers%shlibext,%linalg_test_lib_dir/libmlir_runner_utils%shlibext,%linalg_test_lib_dir/libmlir_float16_utils%shlibext --entry-point-result=void | FileCheck %s --check-prefix="

[[axis]]
name = "transA"
values = ["true"]
prefix = "--transA="

[[axis]]
name = "transB"
values = ["false"]
prefix = "--transB="

[[axis]]
name = "data type"
values = ["f16", "bf16"]
prefix = "-t "

[[suite]]
name = "lds_transpose_load"

[[suite.test]]
config = "-g 1 -m 16 -k 16 -n 16 --perf_config v3:16,16,16,16,16,1,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 32 -k 8 -n 32 --perf_config v3:32,32,8,32,32,1,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 16 -k 64 -n 16 --perf_config v3:16,16,64,16,16,1,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 32 -k 128 -n 32 --perf_config v3:32,32,32,32,32,4,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 32 -k 256 -n 32 --perf_config v3:32,32,256,32,32,1,1,4,2,1,1"

[[suite.test]]
config = "-g 256 -m 32 -k 32 -n 32 --perf_config v3:32,32,32,32,32,1,1,3,2,1,1"

[[suite.test]]
config = "-g 256 -m 16 -k 64 -n 16 --perf_config v3:16,16,64,16,16,1,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 64 -k 64 -n 64 --perf_config v3:64,64,8,16,16,8,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 128 -k 64 -n 128 --perf_config v3:128,128,8,32,32,8,1,4,2,1,1"

[[suite.test]]
config = "-g 1 -m 144 -k 1280 -n 3840 --perf_config v3:32,32,8,32,32,16,1,3,2,1,1"

[[suite.test]]
config = "-g 1 -m 4096 -k 256 -n 384 --perf_config v3:64,64,8,32,32,8,1,4,2,1,1"

[[suite.test]]
config = "-g 256 -m 900 -k 1280 -n 3840 --perf_config v3:128,64,8,32,32,8,1,3,2,1,1"
